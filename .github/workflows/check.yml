name: check

# Runs on every pull request into main, and on main itself so the default
# branch always carries a visible status. The roadmap puts the full gate in
# phase 8; this is the part that can run today, and it grows as real code lands.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --quiet pyyaml

      # Invoked through make rather than directly, so CI exercises the same
      # entry points a developer uses. Calling the modules directly is how CI
      # stayed green while `make contracts` was broken locally by an
      # interpreter name that does not exist on a stock Linux install.
      - name: Validate contracts and golden fixtures
        run: make contracts

      - name: Parse every YAML document in the tree
        run: make yaml

  repo-hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # A hook committed without the executable bit is a guardrail that
      # silently does nothing, which is worse than no guardrail at all.
      - name: Confirm the pre-push hook is executable
        run: test -x infra/githooks/pre-push

      - name: Lint shell scripts
        run: shellcheck infra/githooks/pre-push

      # .env holds credentials once this runs outside local development, and a
      # committed .env is the mistake that is hardest to undo.
      - name: Confirm no .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked; it must stay untracked and gitignored"
            exit 1
          fi
          echo "no tracked .env"
