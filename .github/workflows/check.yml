name: check

# Runs on every pull request into main, and on main itself so the default
# branch always carries a visible status. The roadmap puts the full gate in
# phase 8; this is the part that can run today, and it grows as real code lands.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --quiet pyyaml

      # Invoked through make rather than directly, so CI exercises the same
      # entry points a developer uses. Calling the modules directly is how CI
      # stayed green while `make contracts` was broken locally by an
      # interpreter name that does not exist on a stock Linux install.
      - name: Validate contracts and golden fixtures
        run: make contracts

      - name: Parse every YAML document in the tree
        run: make yaml

  tests:
    name: unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real Postgres, because the durable checkpointer is the whole reason
    # LangGraph was chosen (ADR 0001) and durability cannot be tested against
    # an in-memory saver — that test would pass while the property it claims
    # to verify was absent.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: concord
          POSTGRES_DB: concord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concord"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://concord:concord@localhost:5432/concord_test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and its development dependencies
        run: python -m pip install --quiet -e ".[mocks,dev]" httpx

      - name: Lint and format check
        run: make lint

      - name: Static type check
        run: make types

      # The no-floats-near-money rule. CONTRIBUTING claims it is enforced,
      # which is only true if something runs it.
      - name: Enforce the money rule
        run: make money

      # An import that pyproject does not declare works on a developer's
      # machine and fails on the first clean install. This is how langgraph
      # shipped undeclared in phase 3.
      - name: Check declared dependencies cover every import
        run: make deps

      - name: Run the test suite
        run: make test

      # A skipped test is not a passing test. The durable path is the one
      # most likely to rot unnoticed, so CI asserts it actually ran.
      - name: Confirm the durable checkpointer tests were not skipped
        run: |
          make test PYTEST_ARGS="packages/agent/tests/test_checkpointing.py -q -rs" \
            | tee /tmp/checkpoint.log
          if grep -q "SKIPPED" /tmp/checkpoint.log; then
            echo "::error::checkpointer tests skipped; TEST_DATABASE_URL is not reaching them"
            exit 1
          fi

  console:
    name: reviewer console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      # `ci` rather than `install`: the lock file is the version set the
      # console was verified against, and a CI run that resolves a different
      # one is not testing what will ship.
      - name: Install the console's dependencies
        run: npm --prefix apps/console ci

      - name: Lint and format check
        run: npm --prefix apps/console run lint

      - name: Static type check
        run: npm --prefix apps/console run types

      - name: Run the console's tests
        run: npm --prefix apps/console run test

      # The build is the only thing that exercises the server components and
      # the font pipeline. Lint and types both pass on a console that cannot
      # be served.
      - name: Build
        run: npm --prefix apps/console run build

      # The fonts are vendored through npm precisely so the build needs no
      # third-party CDN. If someone reintroduces `next/font/google`, this is
      # the check that says so rather than a build that fails on a locked-down
      # network months later.
      - name: Confirm no build-time font fetching
        run: |
          if grep -rn "next/font/google" apps/console/src; then
            echo "::error::next/font/google fetches at build time; use the vendored @fontsource packages"
            exit 1
          fi
          echo "fonts are self-hosted"

  repo-hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # A hook committed without the executable bit is a guardrail that
      # silently does nothing, which is worse than no guardrail at all.
      - name: Confirm the pre-push hook is executable
        run: test -x infra/githooks/pre-push

      - name: Lint shell scripts
        run: shellcheck infra/githooks/pre-push

      # .env holds credentials once this runs outside local development, and a
      # committed .env is the mistake that is hardest to undo.
      - name: Confirm no .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked; it must stay untracked and gitignored"
            exit 1
          fi
          echo "no tracked .env"
