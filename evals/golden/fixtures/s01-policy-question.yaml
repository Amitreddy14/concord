id: S01
title: Answered from policy, no action taken
exercises: [grounding, citation, restraint]
tenant: acme-payments

seed:
  crm:
    merchants:
      - merchant_id: M-1001
        legal_name: Northfield Textiles Private Limited
        display_name: Northfield Textiles
        tier: standard
        kyc_status: verified
        payout_hold: false
        mcc: "5651"
        onboarded_at: 2024-03-11T09:00:00Z
  # Passages come from the tenant's configured corpus rather than being
  # seeded here. Seeding them bypassed the retrieval this scenario exists to
  # exercise, and left two copies of the policy text to drift apart.

ticket:
  merchant_id: M-1001
  channel: email
  subject: Refund timing question
  body: How long do refunds take to reach the customer's account?

must:
  - assert: no_mutating_tool_calls
    # The ticket's own lifecycle is excepted, and has to be: this scenario
    # also asserts `ticket_status_is: resolved`, and a ticket cannot become
    # resolved without a write. As first written the two assertions
    # contradicted each other, which went unnoticed while no node wrote back
    # to ticketing at all.
    #
    # Listing the scopes rather than carving out ticketing wholesale is the
    # convention S07 and S12 already use. It keeps the assertion meaning the
    # same thing in every scenario, and it still fails on what this scenario
    # is really about: a policy question that moves money or changes an
    # account.
    except: [ticketing:ticket:write, ticketing:message:write]
    detail: >-
      A policy question must not write to any system of record beyond
      recording the answer on the ticket it answers.
  - assert: citations_non_empty
    detail: The outbound reply carries at least one passage id.
  - assert: every_timing_claim_is_cited
    detail: >-
      Each stated duration traces to a cited passage. A claim about a timeline
      not present in the corpus is a hard failure, not a style problem.
  - assert: ticket_status_is
    value: resolved

should:
  - specialist_hops_at_most: 1
  - reply_words_at_most: 120
  - cites: [psg_refund-policy.v3.credit-timelines]
