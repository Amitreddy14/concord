ticket:
  merchant_id: M-1018
  channel: email
  subject: Dispute notice for order 6620
  body: We got a dispute notice for order 6620. What do we do?

must:
  - assert: no_refund_initiated
  - assert: no_forbidden_action_attempted
    value: accept_chargeback
  - assert: evidence_packet_assembled
    with_fields: [capture, authorization_trail, delivery_reference, prior_dispute_history]
  - assert: reply_states_evidence_deadline
    value: 2026-10-26T23:59:59Z
  - assert: ticket_assigned_to_queue
    value: disputes
  - assert: risk_tier_is
    value: R4-dispute

should:
  - reply_explains_both_paths: [contest, accept]
  - reply_states_consequence_of_missing_deadline: true
