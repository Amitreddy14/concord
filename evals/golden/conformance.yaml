# Policy conformance: what each tenant's configuration decides.
#
# Every expectation here is written by hand from reading the two tenant files,
# never generated by running the engine. That direction matters more than it
# looks: a conformance suite recorded from the engine's own output agrees with
# the engine by construction, including when the engine is wrong. This file is
# a second opinion, and a disagreement between it and `packages/policy/engine`
# is a finding rather than a failing test to be adjusted.
#
# It is also what proves the claim ADR 0006 principle 5 makes — that a
# customer is configuration rather than code. A second tenant agreeing with
# the first would prove nothing, because an engine that ignored configuration
# entirely would pass. So each case records whether the two tenants diverge
# and on which configured dimension, and a totality test requires every
# dimension named in `divergence_dimensions` to diverge in at least one case.
#
# Amounts are minor units interpreted in each tenant's own currency, which is
# the point of several cases: 30000 is ₹300.00 against Acme's ₹2,000.00
# standard cap and €300.00 against Northwind's €250.00 one, so the same
# proposal is routine for one desk and elevated for the other.

divergence_dimensions:
  - window_days
  - autonomy_cap_minor
  - autonomous_reason_codes
  - risk_tier_approval
  - tool_scopes

decisions:
  - id: informational-reply
    note: >-
      A non-mutating action. Both tenants take the informational tier, and
      neither needs anyone's permission to answer a question.
    action:
      kind: reply
    merchant: { tier: standard }
    expect:
      acme-payments: { permission: permitted, rule_id: R0-informational, risk_tier: R0-informational }
      northwind-pay: { permission: permitted, rule_id: R0-informational, risk_tier: R0-informational }

  - id: duplicate-charge-small-and-recent
    note: >-
      The structural difference between the two desks. Both tenants treat a
      duplicate charge as an autonomous reason and both caps clear €/₹200, so
      the same tier conditions hold for each. Acme's routine tier grants
      `approval: none`; Northwind's equivalent routes to a reviewer, because
      this desk does not refund without a human.
    action:
      kind: create_refund
      reason_code: duplicate
      amount_minor: 20000
      capture_id: cap_1
      captures_touched: [cap_1]
    merchant: { tier: standard }
    capture: { captured_days_ago: 10, amount_minor: 500000, refunded_minor: 0 }
    expect:
      acme-payments: { permission: permitted, rule_id: R1-routine-refund, risk_tier: R1-routine-refund }
      northwind-pay: { permission: needs_approval, rule_id: R1-reviewed-refund, risk_tier: R1-reviewed-refund }
    divergence: risk_tier_approval

  - id: buyer-changed-their-mind
    note: >-
      Acme lists `buyer_request` as autonomous; Northwind lists only
      `duplicate`. Same proposal, and the reason code alone moves it from
      routine to reviewed.
    action:
      kind: create_refund
      reason_code: buyer_request
      amount_minor: 20000
      capture_id: cap_1
      captures_touched: [cap_1]
    merchant: { tier: standard }
    capture: { captured_days_ago: 10, amount_minor: 500000, refunded_minor: 0 }
    expect:
      acme-payments: { permission: permitted, rule_id: R1-routine-refund, risk_tier: R1-routine-refund }
      northwind-pay:
        { permission: needs_approval, rule_id: R2b-non-autonomous-reason, risk_tier: R2b-non-autonomous-reason }
    divergence: autonomous_reason_codes

  - id: duplicate-charge-above-one-cap
    note: >-
      30000 minor units is well inside Acme's ₹2,000.00 standard cap and
      outside Northwind's €250.00 one. The reason is autonomous for both, so
      the cap is the only thing deciding, and Northwind falls through the
      non-autonomous-reason tier to the elevated one.
    action:
      kind: create_refund
      reason_code: duplicate
      amount_minor: 30000
      capture_id: cap_1
      captures_touched: [cap_1]
    merchant: { tier: standard }
    capture: { captured_days_ago: 10, amount_minor: 500000, refunded_minor: 0 }
    expect:
      acme-payments: { permission: permitted, rule_id: R1-routine-refund, risk_tier: R1-routine-refund }
      northwind-pay:
        { permission: needs_approval, rule_id: R2-elevated-refund, risk_tier: R2-elevated-refund }
    divergence: autonomy_cap_minor

  - id: duplicate-charge-four-months-old
    note: >-
      120 days sits inside Acme's 180-day window and outside Northwind's 90.
      Note the shape of the refusal: REFUSED rather than NEEDS_APPROVAL, and
      no risk tier, because the obstacle is the state of the world and no
      reviewer can wave it through. The window is checked before any tier is
      matched, which is why `risk_tier` is absent rather than set.
    action:
      kind: create_refund
      reason_code: duplicate
      amount_minor: 20000
      capture_id: cap_1
      captures_touched: [cap_1]
    merchant: { tier: standard }
    capture: { captured_days_ago: 120, amount_minor: 500000, refunded_minor: 0 }
    expect:
      acme-payments: { permission: permitted, rule_id: R1-routine-refund, risk_tier: R1-routine-refund }
      northwind-pay: { permission: refused, rule_id: W0-outside-refund-window, risk_tier: null }
    divergence: window_days

  - id: enterprise-merchant-larger-cap
    note: >-
      The cap is read per merchant tier, not per tenant alone. 150000 minor
      units is inside Acme's enterprise cap of ₹25,000.00 and outside
      Northwind's enterprise cap of €1,000.00.
    action:
      kind: create_refund
      reason_code: duplicate
      amount_minor: 150000
      capture_id: cap_1
      captures_touched: [cap_1]
    merchant: { tier: enterprise }
    capture: { captured_days_ago: 10, amount_minor: 900000, refunded_minor: 0 }
    expect:
      acme-payments: { permission: permitted, rule_id: R1-routine-refund, risk_tier: R1-routine-refund }
      northwind-pay:
        { permission: needs_approval, rule_id: R2-elevated-refund, risk_tier: R2-elevated-refund }
    divergence: autonomy_cap_minor

  - id: multi-capture-refund
    note: >-
      Both tenants require a human for a refund spanning captures even when
      each leg is under the cap, so this is a case where the desks agree. Kept
      because a conformance suite in which every case diverges is not testing
      that the engine reads configuration — it is testing that it reads
      something.
    action:
      kind: create_refund
      reason_code: duplicate
      amount_minor: 20000
      capture_id: cap_1
      captures_touched: [cap_1, cap_2]
    merchant: { tier: standard }
    capture: { captured_days_ago: 10, amount_minor: 500000, refunded_minor: 0 }
    expect:
      acme-payments: { permission: needs_approval, rule_id: R2a-multi-capture, risk_tier: R2a-multi-capture }
      northwind-pay: { permission: needs_approval, rule_id: R2a-multi-capture, risk_tier: R2a-multi-capture }

  - id: refund-beyond-the-unrefunded-remainder
    note: >-
      Also an agreement case, and a REFUSED rather than an approval request
      for the same reason as the window: a reviewer cannot authorise refunding
      money that is not there.
    action:
      kind: create_refund
      reason_code: duplicate
      amount_minor: 20000
      capture_id: cap_1
      captures_touched: [cap_1]
    merchant: { tier: standard }
    capture: { captured_days_ago: 10, amount_minor: 20000, refunded_minor: 15000 }
    expect:
      acme-payments: { permission: refused, rule_id: W3-exceeds-unrefunded-remainder, risk_tier: null }
      northwind-pay: { permission: refused, rule_id: W3-exceeds-unrefunded-remainder, risk_tier: null }

  - id: kyc-status-change
    note: >-
      Forbidden for both, and forbidden by the forbidden-actions list rather
      than by a tier. The tier is still reported, because `risk_tier` says
      what kind of request this was and `rule_id` says what decided it — a
      reviewer asking "why was this refused?" needs the second and one asking
      "what sort of request was it?" needs the first.
    action:
      kind: change_kyc_status
      touches: [kyc]
    merchant: { tier: enterprise }
    expect:
      acme-payments: { permission: forbidden, rule_id: F0-forbidden-action, risk_tier: R3-compliance }
      northwind-pay: { permission: forbidden, rule_id: F0-forbidden-action, risk_tier: R3-compliance }

  - id: accepting-a-chargeback
    note: >-
      Both tenants' tables carry an R4 dispute tier routing this work to a
      specialist queue, and both forbid `accept_chargeback` outright. The list
      wins by its own terms — "actions no risk tier can unlock" — so R4
      classifies and never decides. Recorded here so that stays deliberate.
    action:
      kind: accept_chargeback
      touches: [chargeback]
    merchant: { tier: growth }
    expect:
      acme-payments: { permission: forbidden, rule_id: F0-forbidden-action, risk_tier: R4-dispute }
      northwind-pay: { permission: forbidden, rule_id: F0-forbidden-action, risk_tier: R4-dispute }

scopes:
  # Northwind's disputes desk is a separate team, so the agent has no
  # chargeback read at all there. Routing a ticket to that queue is not the
  # same as being able to read the dispute.
  - scope: payments:chargeback:read
    expect: { acme-payments: true, northwind-pay: false }
    divergence: tool_scopes
  - scope: payments:refund:write
    expect: { acme-payments: true, northwind-pay: true }
  - scope: crm:merchant:read
    expect: { acme-payments: true, northwind-pay: true }
  - scope: payments:payout:write
    note: Enabled by neither. Nothing in this system lifts a payout hold.
    expect: { acme-payments: false, northwind-pay: false }
